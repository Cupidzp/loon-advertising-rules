name: Sync Advertising and Apple rules

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and combine rules
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/Advertising/Advertising.list" \
            --output /tmp/Advertising.list
          curl --fail --location --silent --show-error --retry 3 \
            "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/Advertising/Advertising_Domain.list" \
            --output /tmp/Advertising_Domain.list
          curl --fail --location --silent --show-error --retry 3 \
            "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/Apple/Apple.list" \
            --output /tmp/Apple.list
          curl --fail --location --silent --show-error --retry 3 \
            "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Loon/Apple/Apple_Domain.list" \
            --output /tmp/Apple_Domain.list

          cp /tmp/Advertising.list Advertising.list
          sed '/^#/d; /^[[:space:]]*$/d' /tmp/Advertising_Domain.list >> Advertising.list
          cp /tmp/Apple.list Apple.list
          sed '/^#/d; /^[[:space:]]*$/d' /tmp/Apple_Domain.list >> Apple.list

          rm -f Advertising_Domain.list
          rm -f Apple_Domain.list

      - name: Commit changes
        run: |
          git add -A -- Advertising.list Advertising_Domain.list Apple.list Apple_Domain.list
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync Advertising and Apple rules"
          git push
